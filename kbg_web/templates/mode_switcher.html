<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vydra 🦦 — Режими</title>
    <link rel="icon" type="image/png" href="/static/vydra-sm.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <div style="display:flex; align-items:center; justify-content:center; gap:0.9rem; margin-bottom:0.4rem;">
                <img src="/static/vydra-sm.png" alt="Vydra" class="brand-logo">
                <h1 style="margin:0;">Vydra</h1>
            </div>
            <p style="margin-bottom: 1.5rem;">⚙️ Режими роботи GPU — тільки один активний одночасно</p>
            <div style="display: flex; justify-content: center; gap: 1rem; margin-bottom: 0.5rem; flex-wrap: wrap;">
                <a href="/" class="btn btn-secondary" style="text-decoration: none; padding: 0.5rem 1.25rem; font-size: 0.9rem; border-radius: 8px; font-weight: 600; display: inline-flex; align-items: center; gap: 0.4rem;">
                    🖥️ Дашборд
                </a>
                <a href="/modes" class="btn btn-primary" style="text-decoration: none; padding: 0.5rem 1.25rem; font-size: 0.9rem; border-radius: 8px; font-weight: 600; display: inline-flex; align-items: center; gap: 0.4rem; box-shadow: 0 4px 12px rgba(139, 92, 246, 0.2);">
                    ⚙️ Режими
                </a>
            </div>
        </header>

        <div class="dashboard-single-col">
            <div class="glass-card" style="padding: 1.2rem;">
                <div style="font-weight:600; margin-bottom:0.6rem;">Поточний стан:</div>
                <div id="currentModeLine" style="font-size:1.1rem;">…</div>
            </div>

            <div class="glass-card" style="padding: 1.2rem; margin-top: 1rem;">
                <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1rem;">

                    <div class="glass-card" style="padding:1rem;">
                        <div style="font-weight:600; margin-bottom:0.5rem;">📚 Vydra</div>
                        <div style="font-size:0.85rem; color:var(--text-secondary); margin-bottom:0.8rem;">
                            Переклад книг/манги (Hy-MT2-7B, порт 8081)
                        </div>
                        <button class="btn btn-primary" style="width:100%; padding:0.5rem; border-radius:8px; cursor:pointer;"
                                onclick="switchMode('vydra')">Активувати</button>
                    </div>

                    <div class="glass-card" style="padding:1rem;">
                        <div style="font-weight:600; margin-bottom:0.5rem;">🤖 Кодинг-модель</div>
                        <div style="font-size:0.85rem; color:var(--text-secondary); margin-bottom:0.8rem;">
                            Bonsai-27B-Q1_0 (Vulkan GPU, порт 8082)
                        </div>
                        <button class="btn btn-primary" style="width:100%; padding:0.5rem; border-radius:8px; cursor:pointer;"
                                onclick="switchMode('coding')">Активувати</button>
                    </div>

                    <div class="glass-card" style="padding:1rem;">
                        <div style="font-weight:600; margin-bottom:0.5rem;">🇨🇭 Швейцарські опитування</div>
                        <div style="font-size:0.85rem; color:var(--text-secondary); margin-bottom:0.8rem;">
                            Gemma 3 4B vision + Chrome (SOCKS5 Swiss proxy)
                        </div>
                        <label style="font-size:0.8rem; color:var(--text-secondary); display:block; margin-bottom:0.2rem;">👤 Акаунт / Профіль:</label>
                        <select id="surveyProfile" style="width:100%; margin-bottom:0.6rem; padding:0.45rem; border-radius:6px; background:#1e1e2d; color:#fff; border:1px solid #333;">
                            <option value="arno">Арно Дюбуа (Гланд, 25р.)</option>
                            <option value="annet">Аннет Буонасьє (Гланд, 52р.)</option>
                        </select>
                        <label style="font-size:0.8rem; color:var(--text-secondary); display:block; margin-bottom:0.2rem;">🌐 Сайт опитувань / URL:</label>
                        <input id="surveyUrl" type="text" value="https://meinungsplatz.ch/" placeholder="https://meinungsplatz.ch/"
                               style="width:100%; margin-bottom:0.6rem; padding:0.45rem; border-radius:6px; background:#1e1e2d; color:#fff; border:1px solid #333; box-sizing:border-box;">
                        <label style="font-size:0.8rem; display:flex; align-items:center; gap:0.4rem; margin-bottom:0.8rem; cursor:pointer;">
                            <input id="surveyDryRun" type="checkbox" checked style="width:auto; margin:0;">
                            🛡️ Режим без фінальної відправки (--dry-run)
                        </label>
                        <button class="btn btn-primary" style="width:100%; padding:0.5rem; border-radius:8px; cursor:pointer;"
                                onclick="switchMode('survey')">Запустити опитування</button>
                    </div>

                </div>

                <button class="btn-outline" style="width:100%; margin-top:1rem; padding:0.6rem; border-radius:8px; cursor:pointer;"
                        onclick="switchMode('idle')">🛑 Зупинити все</button>

                <div id="switchStatus" style="margin-top:0.8rem; font-size:0.85rem; color:var(--text-secondary);"></div>
            </div>
        </div>
    </div>

    <script>
    const MODE_LABELS = {
        vydra: "📚 Vydra (переклад)",
        coding: "🤖 Кодинг-модель (Bonsai-27B)",
        survey: "🇨🇭 Швейцарські опитування",
        idle: "💤 Нічого не запущено",
    };

    async function refreshMode() {
        try {
            const r = await fetch("/api/mode");
            const data = await r.json();
            document.getElementById("currentModeLine").textContent =
                MODE_LABELS[data.mode] || data.mode;
        } catch (e) {
            document.getElementById("currentModeLine").textContent = "Помилка отримання статусу";
        }
    }

    async function switchMode(target) {
        const statusEl = document.getElementById("switchStatus");
        const body = { target };
        if (target === "survey") {
            body.profile = document.getElementById("surveyProfile").value;
            body.url = document.getElementById("surveyUrl").value.trim();
            body.dry_run = document.getElementById("surveyDryRun").checked;
            if (!body.url) {
                statusEl.textContent = "⚠️ Вкажіть URL опитування.";
                return;
            }
        }
        statusEl.textContent = "⏳ Перемикання...";
        try {
            const r = await fetch("/api/mode/switch", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(body),
            });
            const data = await r.json();
            statusEl.textContent = (data.status === "success" ? "✅ " : "❌ ") + data.message;
        } catch (e) {
            statusEl.textContent = "❌ Помилка запиту: " + e;
        }
        setTimeout(refreshMode, 2000);
    }

    refreshMode();
    setInterval(refreshMode, 5000);
    </script>
</body>
</html>
